# Render ücretsiz servisi 15 dakika istek almazsa uyur; ilk istek ~1 dakika sürer.
# Bu iş her 10 dakikada bir /health ucunu çağırarak servisi uyanık tutar.
# Saatler UTC: 04:00–21:50 UTC = Türkiye 07:00–00:50 (gece uyumasına izin verilir; ücretsiz aylık saat hakkını korur).
# Depo herkese açıksa GitHub Actions dakikaları ücretsizdir; özelse ayda 2000 dakika sınırı vardır ve bu iş onu aşar (GUNCELLEME_ADIMLARI.md › "Sunucuyu uyanık tut").
# Adresi değiştirmek için: depo → Settings → Secrets and variables → Actions → Variables → SERVER_URL
name: keepalive
on:
  schedule:
    - cron: "*/10 4-21 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Sunucuyu uyandır
        env:
          URL: ${{ vars.SERVER_URL || 'https://rota-sunucu.onrender.com' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 70 -w "%{http_code}" "$URL/health" || true)
            echo "deneme $i: HTTP ${code:-yok}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Sunucu yanıt vermedi (Render uyanıyor olabilir); sonraki turda tekrar denenecek."
          exit 0
