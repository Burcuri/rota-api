services:
  - type: web
    name: rota-asistan
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rota-db
          property: connectionString
      - key: PUBLIC_BASE
        sync: false

databases:
  - name: rota-db
    plan: free
    databaseName: rota
    user: rota
