# Render ayarı (yalnız "Blueprint" ile kurulursa kullanılır; mevcut rota-sunucu servisi elle kuruldu, bu dosyadan etkilenmez).
# 1.21.1: veritabanı Render'da DEĞİL — Supabase (Rota › rota-api, "Session pooler" adresi). DATABASE_URL, ADMIN_KEY, DESTEK_EPOSTA
# değerleri yalnız Render › Environment'ta durur; koda / GitHub'a yazılmaz.
services:
  - type: web
    name: rota-sunucu
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_BASE
        sync: false
      - key: DESTEK_EPOSTA
        sync: false
